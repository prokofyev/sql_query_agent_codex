# Схема демонстрационной базы для панели в интерфейсе.
#
# Рисунок хранится готовым текстом в псевдографике и правится вручную: при
# перезаливке данных или смене базы схему перерисовывают здесь же. Число
# строк — статичный снимок на момент заливки, а не живое значение из базы.
#
# Рисунок идёт слева направо: brand -> product -> sku, а справочники размеров
# и цветов — под таблицей sku. Так схема занимает меньше высоты экрана.
#
# Путь к файлу задаётся настройкой `SQA_SCHEMA__PATH`. Отсутствующий или
# пустой файл означает «схемы нет»: панель в интерфейсе не показывается, и
# это не ошибка. Повреждённый файл (нет поля `diagram`) — ошибка загрузки.
#
# Поля: обязательное `diagram`; необязательное `caption`.

caption: Схема демо-базы products; число строк — снимок на момент заливки

diagram: |
  +--------------------+              +-------------------------+              +----------------------------------------+
  | brand — 1 000      |              | product — 20 000        |              | sku — 100 000                          |
  |--------------------|        1 : N |-------------------------|        1 : N |----------------------------------------|
  |   brand_id      PK |------------->|   product_id         PK |------------->|   sku_id                            PK |
  |   brand_name       |              |   product_name          |              |   product_id             FK -> product |
  +--------------------+              |   brand_id  FK -> brand |              |   product_size_id   FK -> product_size |
                                      +-------------------------+              |   product_color_id FK -> product_color |
                                                                               |   added_at                             |
                                                                               +----------------------------------------+
                                                                                       ^ N : 1                  ^ N : 1
                                                                                       |                        |
                                                                        +------------------------+   +------------------------+
                                                                        | product_size — 50      |   | product_color — 2      |
                                                                        |------------------------|   |------------------------|
                                                                        |   product_size_id   PK |   |   product_color_id  PK |
                                                                        |   product_size_name    |   |   product_color_name   |
                                                                        +------------------------+   +------------------------+
